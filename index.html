<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily English</title>
<meta name="description" content="Practice everyday English conversation, every day.">
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily English">
<style>
  :root {
    --bg: #0B0C10;
    --surface: #16171D;
    --surface-2: #1E2029;
    --border: #2A2D38;
    --text: #EDEEF2;
    --text-dim: #9296A6;
    --accent: #6366F1;
    --accent-dim: #4F46E5;
    --correction: #F5A623;
    --correction-bg: rgba(245, 166, 35, 0.1);
    --phrasal: #34D399;
    --phrasal-bg: rgba(52, 211, 153, 0.12);
    --danger: #F87171;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F5F6F9;
      --surface: #FFFFFF;
      --surface-2: #F0F1F5;
      --border: #E3E5EC;
      --text: #1A1C23;
      --text-dim: #676B7A;
      --accent: #4F46E5;
      --accent-dim: #4338CA;
      --correction: #B7791F;
      --correction-bg: rgba(183, 121, 31, 0.08);
      --phrasal: #0D9668;
      --phrasal-bg: rgba(13, 150, 104, 0.08);
      --danger: #DC2626;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; min-width: 0; }
  html, body { height: 100%; width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; width: 100%; max-width: 100vw; overflow: hidden; }

  header {
    padding: calc(12px + var(--safe-top)) 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: white; flex-shrink: 0;
  }
  .brand-title { font-weight: 600; font-size: 15px; line-height: 1.2; }
  .brand-sub { font-size: 12px; color: var(--text-dim); }
  .streak {
    display: flex; align-items: center; gap: 5px;
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 20px; font-size: 13px; font-weight: 600;
  }
  .streak-flame { font-size: 14px; }
  .icon-btn {
    background: none; border: none; color: var(--text-dim);
    font-size: 20px; padding: 4px 8px; cursor: pointer; line-height: 1;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    -webkit-overflow-scrolling: touch;
  }
  .msg-row { display: flex; flex-direction: column; max-width: 88%; }
  .msg-row.user { align-self: flex-end; align-items: flex-end; }
  .msg-row.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.45;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg-row.user .bubble {
    background: var(--accent); color: white; border-bottom-right-radius: 4px;
  }
  .msg-row.bot .bubble {
    background: var(--surface-2); border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg-actions { display: flex; margin-top: 4px; }
  .play-btn {
    display: flex; align-items: center; gap: 5px;
    background: none; border: none; color: var(--text-dim);
    font-size: 12px; padding: 3px 6px; cursor: pointer; border-radius: 8px;
  }
  .play-btn:active { background: var(--surface-2); }
  .play-btn.playing { color: var(--accent); }
  .play-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
  .note {
    margin-top: 6px; padding: 8px 12px; border-radius: 10px;
    font-size: 13px; line-height: 1.4; max-width: 100%;
  }
  .note.correction {
    background: var(--correction-bg); color: var(--correction);
    border: 1px solid color-mix(in srgb, var(--correction) 30%, transparent);
  }
  .note.phrasal {
    background: var(--phrasal-bg); color: var(--phrasal);
    border: 1px solid color-mix(in srgb, var(--phrasal) 30%, transparent);
  }
  .note b { font-weight: 700; }
  .note-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.85; display: block; margin-bottom: 2px; }

  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  #composer {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px calc(10px + var(--safe-bottom));
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  #textInput {
    flex: 1; resize: none; max-height: 120px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 10px 16px; font-size: 15px; font-family: inherit; line-height: 1.4;
    outline: none;
  }
  #textInput:focus { border-color: var(--accent); }
  #sendBtn {
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: var(--accent); color: white; font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    flex-shrink: 0; transition: opacity 0.15s;
  }
  #sendBtn:disabled { opacity: 0.4; }
  #micBtn {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 17px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    flex-shrink: 0; transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  #micBtn.listening {
    background: var(--danger); color: white; border-color: var(--danger);
    animation: pulse 1.2s infinite;
  }
  #micBtn[hidden] { display: none; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 45%, transparent); }
    50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--danger) 0%, transparent); }
  }

  .empty-state {
    margin: auto; text-align: center; color: var(--text-dim); padding: 32px;
  }
  .empty-state h2 { color: var(--text); font-size: 18px; margin-bottom: 8px; }
  .topic-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 8px 14px; border-radius: 16px; font-size: 13px; cursor: pointer;
  }
  .chip:active { background: var(--accent); color: white; border-color: var(--accent); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    z-index: 50;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px; max-width: 380px; width: 100%;
  }
  .modal h3 { margin: 0 0 6px; font-size: 17px; }
  .modal p { margin: 0 0 14px; font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .modal input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 11px 13px; font-size: 14px;
    outline: none; margin-bottom: 12px;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 11px; border-radius: 10px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .modal a { color: var(--accent); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; }
  .stat-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-mark">EN</div>
      <div>
        <div class="brand-title">Daily English</div>
        <div class="brand-sub" id="subLine">Everyday conversation practice</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="streak" id="streakPill"><span class="streak-flame">🔥</span><span id="streakCount">0</span></div>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>
  </header>

  <div id="messages"></div>

  <div id="composer">
    <textarea id="textInput" rows="1" placeholder="Type in English…" autocomplete="off" autocapitalize="sentences"></textarea>
    <button id="micBtn" title="Speak" hidden>🎤</button>
    <button id="sendBtn">➤</button>
  </div>
</div>

<script>
const STORAGE_KEYS = {
  apiKey: 'de_api_key',
  history: 'de_history',
  streak: 'de_streak_data',
};

const TOPIC_STARTERS = [
  "Let's talk about your weekend",
  "Tell me about your favorite food",
  "Describe your morning routine",
  "Let's chat about the weather",
  "Talk about a hobby you enjoy",
  "Tell me about your city",
];

const SYSTEM_PROMPT = `You are a friendly, patient English conversation partner. Your student is practicing everyday, general English (not business/technical jargon). Your job:

1. Have a natural, warm, everyday conversation. Ask follow-up questions. Keep your own replies fairly short (2-4 sentences) so the student does most of the talking.
2. Gently correct grammar mistakes in the student's LAST message, but only if there's a real error (don't invent problems). Keep the tone encouraging, never harsh.
3. Actively teach phrasal verbs: when natural, use a common English phrasal verb in your reply and briefly note what it means. Also, if the student's message could have naturally used a phrasal verb instead of a more formal/literal expression, gently suggest it.
4. Vary everyday topics: daily life, food, weather, hobbies, family, weekend plans, shopping, travel, routines, feelings, small talk.

You MUST respond with ONLY a single valid JSON object, no markdown fences, no extra text, matching exactly this shape:
{"reply": "your conversational reply here", "correction": "short gentle correction note, or null if no mistake", "phrasal_verb": "the phrasal verb you used or suggested, in the form 'phrasal verb — meaning', or null if none this turn"}

Keep "correction" under 25 words when present. Keep "phrasal_verb" under 20 words when present. Never include anything outside the JSON object.`;

let apiKey = localStorage.getItem(STORAGE_KEYS.apiKey) || '';
let history = JSON.parse(localStorage.getItem(STORAGE_KEYS.history) || '[]');
let streakData = JSON.parse(localStorage.getItem(STORAGE_KEYS.streak) || '{"streak":0,"lastDate":null,"totalDays":0,"totalMessages":0}');

const messagesEl = document.getElementById('messages');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const streakCountEl = document.getElementById('streakCount');
const settingsBtn = document.getElementById('settingsBtn');
const subLine = document.getElementById('subLine');

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function daysBetween(a, b) {
  const d1 = new Date(a), d2 = new Date(b);
  return Math.round((d2 - d1) / 86400000);
}

function updateStreakUI() {
  streakCountEl.textContent = streakData.streak;
}

function registerActivity() {
  const today = todayStr();
  if (streakData.lastDate === today) {
    // already counted today
  } else if (streakData.lastDate && daysBetween(streakData.lastDate, today) === 1) {
    streakData.streak += 1;
    streakData.totalDays += 1;
  } else {
    streakData.streak = 1;
    streakData.totalDays += 1;
  }
  streakData.lastDate = today;
  streakData.totalMessages += 1;
  localStorage.setItem(STORAGE_KEYS.streak, JSON.stringify(streakData));
  updateStreakUI();
}

function saveHistory() {
  // keep last 40 turns to bound payload size
  const trimmed = history.slice(-40);
  localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(trimmed));
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderEmptyState() {
  messagesEl.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'empty-state';
  wrap.innerHTML = `
    <h2>Ready to practice?</h2>
    <div>Pick a topic or just say hi — I'll correct your English gently and teach you phrasal verbs as we go.</div>
    <div class="topic-chips" id="chips"></div>
  `;
  messagesEl.appendChild(wrap);
  const chipsEl = wrap.querySelector('#chips');
  TOPIC_STARTERS.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = t;
    chip.onclick = () => { textInput.value = t; sendMessage(); };
    chipsEl.appendChild(chip);
  });
}

function renderMessage(role, content, extras) {
  const row = document.createElement('div');
  row.className = `msg-row ${role === 'user' ? 'user' : 'bot'}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  row.appendChild(bubble);

  if (role === 'bot' && ttsSupported) {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    const playBtn = document.createElement('button');
    playBtn.className = 'play-btn';
    playBtn.innerHTML = playIconSvg();
    playBtn.setAttribute('aria-label', 'Play');
    playBtn.onclick = () => toggleSpeak(content, playBtn);
    actions.appendChild(playBtn);
    row.appendChild(actions);
  }

  if (extras && extras.correction) {
    const note = document.createElement('div');
    note.className = 'note correction';
    note.innerHTML = `<span class="note-label">Correction</span>${escapeHtml(extras.correction)}`;
    row.appendChild(note);
  }
  if (extras && extras.phrasal_verb) {
    const note = document.createElement('div');
    note.className = 'note phrasal';
    note.innerHTML = `<span class="note-label">Phrasal verb</span>${escapeHtml(extras.phrasal_verb)}`;
    row.appendChild(note);
  }
  messagesEl.appendChild(row);
  scrollToBottom();
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingRow';
  row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(row);
  scrollToBottom();
}
function removeTyping() {
  const el = document.getElementById('typingRow');
  if (el) el.remove();
}

function renderAllHistory() {
  if (history.length === 0) {
    renderEmptyState();
    return;
  }
  messagesEl.innerHTML = '';
  history.forEach(turn => {
    if (turn.role === 'user') renderMessage('user', turn.content);
    else renderMessage('bot', turn.content, { correction: turn.correction, phrasal_verb: turn.phrasal_verb });
  });
  scrollToBottom();
}

async function callClaude(userText) {
  const apiHistory = history.map(t => {
    if (t.role === 'user') return { role: 'user', content: t.content };
    return { role: 'assistant', content: JSON.stringify({ reply: t.content, correction: t.correction || null, phrasal_verb: t.phrasal_verb || null }) };
  });
  apiHistory.push({ role: 'user', content: userText });

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5-20250929',
      max_tokens: 400,
      system: SYSTEM_PROMPT,
      messages: apiHistory,
    }),
  });

  if (!res.ok) {
    const errBody = await res.text().catch(() => '');
    throw new Error(`API error ${res.status}: ${errBody.slice(0, 200)}`);
  }
  const data = await res.json();
  const raw = (data.content || []).map(b => b.text || '').join('').trim();
  return parseModelJson(raw);
}

function parseModelJson(raw) {
  let cleaned = raw.trim();
  cleaned = cleaned.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '');
  try {
    const obj = JSON.parse(cleaned);
    return {
      reply: obj.reply || cleaned,
      correction: obj.correction && obj.correction !== 'null' ? obj.correction : null,
      phrasal_verb: obj.phrasal_verb && obj.phrasal_verb !== 'null' ? obj.phrasal_verb : null,
    };
  } catch (e) {
    return { reply: cleaned, correction: null, phrasal_verb: null };
  }
}

async function sendMessage() {
  const text = textInput.value.trim();
  if (!text) return;
  if (!apiKey) { openSettings(); return; }

  if (history.length === 0) messagesEl.innerHTML = '';

  history.push({ role: 'user', content: text });
  renderMessage('user', text);
  textInput.value = '';
  textInput.style.height = 'auto';
  sendBtn.disabled = true;
  renderTyping();

  try {
    const result = await callClaude(text);
    removeTyping();
    history.push({ role: 'assistant', content: result.reply, correction: result.correction, phrasal_verb: result.phrasal_verb });
    renderMessage('bot', result.reply, result);
    saveHistory();
    registerActivity();
  } catch (err) {
    removeTyping();
    renderMessage('bot', `Something went wrong: ${err.message}. Check your API key in settings.`);
  } finally {
    sendBtn.disabled = false;
  }
}

textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
});
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);

// Text-to-speech (read bot replies aloud)
const ttsSupported = 'speechSynthesis' in window;
let currentUtterance = null;
let currentPlayBtn = null;

function playIconSvg() {
  return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Listen`;
}
function pauseIconSvg() {
  return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg> Stop`;
}

function resetPlayBtn(btn) {
  btn.innerHTML = playIconSvg();
  btn.classList.remove('playing');
}

function toggleSpeak(text, btn) {
  if (currentUtterance && currentPlayBtn === btn) {
    window.speechSynthesis.cancel();
    resetPlayBtn(btn);
    currentUtterance = null;
    currentPlayBtn = null;
    return;
  }
  window.speechSynthesis.cancel();
  if (currentPlayBtn) resetPlayBtn(currentPlayBtn);

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.95;
  utter.onend = () => {
    resetPlayBtn(btn);
    currentUtterance = null;
    currentPlayBtn = null;
  };
  utter.onerror = () => {
    resetPlayBtn(btn);
    currentUtterance = null;
    currentPlayBtn = null;
  };
  currentUtterance = utter;
  currentPlayBtn = btn;
  btn.innerHTML = pauseIconSvg();
  btn.classList.add('playing');
  window.speechSynthesis.speak(utter);
}

// Speech-to-text (Web Speech API — supported on Chrome/Edge/Safari 14.5+;
// gracefully hidden where unsupported, e.g. some iOS Safari versions).
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let isListening = false;

if (SpeechRecognitionCtor) {
  micBtn.hidden = false;
  recognizer = new SpeechRecognitionCtor();
  recognizer.lang = 'en-US';
  recognizer.continuous = false;
  recognizer.interimResults = true;

  let baseText = '';

  recognizer.onstart = () => {
    isListening = true;
    baseText = textInput.value ? textInput.value.trim() + ' ' : '';
    micBtn.classList.add('listening');
  };

  recognizer.onresult = (event) => {
    let transcript = '';
    for (let i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    textInput.value = baseText + transcript;
    textInput.style.height = 'auto';
    textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
  };

  recognizer.onerror = (event) => {
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
      renderMessage('bot', "I need microphone permission to hear you — check your browser/site settings and try again.");
    }
  };

  recognizer.onend = () => {
    isListening = false;
    micBtn.classList.remove('listening');
  };

  micBtn.addEventListener('click', () => {
    if (isListening) {
      recognizer.stop();
    } else {
      textInput.focus();
      try { recognizer.start(); } catch (e) { /* already started */ }
    }
  });
} else {
  micBtn.hidden = true;
}

// Settings modal
function openSettings() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Settings</h3>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-num">${streakData.streak}</div><div class="stat-label">Day streak 🔥</div></div>
        <div class="stat-box"><div class="stat-num">${streakData.totalDays}</div><div class="stat-label">Days practiced</div></div>
      </div>
      <p>Your Anthropic API key, stored only on this device. Get one at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>.</p>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." value="${apiKey ? apiKey.replace(/./g, '•').slice(0,20) : ''}" />
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#apiKeyInput');
  input.addEventListener('focus', () => { if (apiKey) input.value = ''; });
  overlay.querySelector('#cancelBtn').onclick = () => overlay.remove();
  overlay.querySelector('#saveBtn').onclick = () => {
    const val = input.value.trim();
    if (val && !val.includes('•')) {
      apiKey = val;
      localStorage.setItem(STORAGE_KEYS.apiKey, apiKey);
    }
    overlay.remove();
  };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}
settingsBtn.addEventListener('click', openSettings);

// init
updateStreakUI();
renderAllHistory();
if (!apiKey) {
  setTimeout(openSettings, 300);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
